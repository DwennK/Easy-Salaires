[package]
name = "easy-salaires"
version = "0.1.1"
description = "Offline Swiss payroll"
edition = "2021"
[lib]
name = "easy_salaires_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
fs2 = "0.4"
rfd = "0.15"
chrono = "0.4"
base64 = "0.22"
open = "5"
tempfile = "3"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"

# LLVM's debug-info stripping can misalign Mach-O proc macros on macOS 27.
# These build-time libraries are never shipped in the application bundle.
[profile.release.build-override]
debug = true
strip = false
