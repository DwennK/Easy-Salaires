name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  prepare:
    name: Validate version and prepare draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
      - run: node scripts/release.mjs prepare "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
      - name: Install pinned pnpm and dependencies
        run: |
          npm install --global pnpm@12.10.1
          pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}
      - name: Check application and storage
        run: |
          pnpm check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"
      - name: Build signed installer and updater package
        run: pnpm tauri build --target "${{ matrix.target }}" --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Verify signatures and upload to draft
        run: node scripts/release.mjs upload "$RELEASE_TAG" "${{ matrix.target }}"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish both targets together
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
      - name: Verify artifacts, create updater manifest and publish
        run: node scripts/release.mjs publish "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
